name: Quality and Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Cada lunes a las 8:00 UTC
    - cron: '0 8 * * 1'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: npm audit (producción)
        run: npm audit --omit=dev --audit-level=moderate

      - name: Build check
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder

      - name: Unit and security tests
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Public E2E tests
        run: npm run test:e2e:public
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder
          # Número ficticio con formato válido: los E2E interceptan la
          # navegación a api.whatsapp.com, nunca sale tráfico real.
          VITE_WHATSAPP_NUMBER: "521234567890"

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
