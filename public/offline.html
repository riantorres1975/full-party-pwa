<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fbf7f3" />
    <title>Sin conexi&oacute;n | Full Party</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #27143f;
        background:
          radial-gradient(circle at 15% 15%, rgba(255, 61, 172, 0.13), transparent 34%),
          radial-gradient(circle at 85% 20%, rgba(14, 165, 233, 0.14), transparent 32%),
          #fbf7f3;
        font-family: Nunito, ui-rounded, sans-serif;
      }
      main {
        width: min(100%, 420px);
        padding: 32px;
        text-align: center;
        border: 1px solid #ead7ff;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 24px 70px rgba(94, 45, 145, 0.14);
      }
      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
        border-radius: 20px;
        color: white;
        background: linear-gradient(135deg, #db2777, #6d28d9);
        font-size: 22px;
        font-weight: 900;
      }
      h1 { margin: 0; font-size: 1.65rem; }
      p { margin: 12px 0 24px; color: #5f5270; line-height: 1.55; }
      a {
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 24px;
        border-radius: 16px;
        color: white;
        background: #6d28d9;
        font-weight: 800;
        text-decoration: none;
      }
      a:focus-visible { outline: 3px solid #0ea5e9; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">FP</div>
      <h1>Est&aacute;s sin conexi&oacute;n</h1>
      <p>Si ya visitaste el cat&aacute;logo, tus productos guardados volver&aacute;n a mostrarse al reintentar.</p>
      <a href="/catalogo">Reintentar conexi&oacute;n</a>
    </main>
  </body>
</html>
