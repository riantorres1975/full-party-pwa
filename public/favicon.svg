<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3dac"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="192" height="192" rx="40" ry="40"/>
    </clipPath>
  </defs>
  <!-- Fondo degradado -->
  <rect width="192" height="192" rx="40" ry="40" fill="url(#bg)"/>
  <!-- Letras FP estilizadas -->
  <text x="96" y="118" font-family="Arial Rounded MT Bold, Arial, sans-serif"
        font-size="96" font-weight="900" text-anchor="middle"
        fill="white" clip-path="url(#round)"
        style="letter-spacing:-4px">FP</text>
  <!-- Globo decorativo pequeño -->
  <ellipse cx="152" cy="44" rx="16" ry="19" fill="white" opacity="0.9"/>
  <ellipse cx="146" cy="38" rx="5" ry="6" fill="white" opacity="0.4"/>
  <line x1="152" y1="63" x2="152" y2="74" stroke="white" stroke-width="2" opacity="0.7"/>
</svg>