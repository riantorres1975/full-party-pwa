<!DOCTYPE html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbf7f3" />
    <meta name="description" content="Distribuidora de artículos de fiesta al mayoreo en Uruapan, Michoacán. Globos, vajilla desechable, decoración temática y más. Precios escalonados, pedidos por WhatsApp." />
    <meta name="keywords" content="mayoreo artículos de fiesta, globos al mayoreo, decoración fiesta Uruapan, vajilla desechable, piñatas mayoreo, Full Party Uruapan, distribuidora fiesta Michoacán" />
    <meta name="author" content="<%- NOMBRE_NEGOCIO %>" />

    <!-- Open Graph -->
    <meta property="og:title" content="<%- NOMBRE_NEGOCIO %> — Mayoreo de Artículos para Fiesta en Uruapan" />
    <meta property="og:description" content="Distribuidora de artículos de fiesta al mayoreo en Uruapan. Globos, vajilla, decoración y más. Precios escalonados, pedidos por WhatsApp." />
    <meta property="og:image" content="<%- SITE_URL %>/og-image.jpg" />
    <meta property="og:url" content="<%- SITE_URL %>/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="<%- NOMBRE_NEGOCIO %>" />
    <meta property="og:locale" content="es_MX" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="<%- NOMBRE_NEGOCIO %> — Mayoreo de Artículos para Fiesta" />
    <meta name="twitter:description" content="Distribuidora de artículos de fiesta al mayoreo en Uruapan. Globos, vajilla, decoración y más." />
    <meta name="twitter:image" content="<%- SITE_URL %>/og-image.jpg" />

    <!-- Canonical -->
    <link rel="canonical" href="<%- SITE_URL %>/" />

    <!-- Preconnect: Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;500;600;700;800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
      <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;500;600;700;800&display=swap" />
    </noscript>
    <!-- Preconnect: placeholder images fallback -->
    <link rel="dns-prefetch" href="https://placehold.co" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="<%- NOMBRE_NEGOCIO %>" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <title><%- NOMBRE_NEGOCIO %> — Mayoreo de Artículos para Fiesta en Uruapan</title>

    <style>
      #root {
        opacity: 0;
        transition: opacity 260ms ease;
      }

      body.fp-app-ready #root {
        opacity: 1;
      }

      #fp-boot-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at 20% 15%, rgba(255, 61, 172, 0.4) 0%, transparent 42%),
          radial-gradient(circle at 85% 20%, rgba(0, 212, 255, 0.35) 0%, transparent 45%),
          radial-gradient(circle at 50% 85%, rgba(255, 225, 53, 0.25) 0%, transparent 48%),
          linear-gradient(145deg, #ffffff 0%, #f9f2ff 58%, #f4edff 100%);
        opacity: 1;
        visibility: visible;
        transition: opacity 360ms ease, visibility 360ms ease;
      }

      body.fp-app-ready #fp-boot-overlay {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .fp-boot-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 20px 24px 18px;
        border-radius: 24px;
        border: 2px solid #e9d5ff;
        background: rgba(255, 255, 255, 0.84);
        box-shadow: 0 20px 60px rgba(107, 53, 184, 0.24);
        backdrop-filter: blur(12px);
        animation: fpBootCardIn 700ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      .fp-boot-logo {
        width: clamp(86px, 19vw, 120px);
        height: auto;
        border-radius: 24px;
        border: 2px solid #f3e8ff;
        box-shadow: 0 12px 28px rgba(107, 53, 184, 0.22);
        animation: fpBootLogoFloat 2s ease-in-out 0.6s infinite;
      }

      .fp-boot-title {
        margin: 0;
        font-family: 'Fredoka One', cursive;
        font-size: clamp(28px, 5vw, 36px);
        line-height: 1;
        background: linear-gradient(135deg, #ff3dac, #a855f7, #00d4ff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .fp-boot-subtitle {
        margin: 0;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #8b7aa8;
        font-family: 'Nunito', sans-serif;
      }

      @keyframes fpBootCardIn {
        from { opacity: 0; transform: translateY(20px) scale(0.94); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes fpBootLogoFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
    </style>

    <!-- JSON-LD: LocalBusiness -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "<%- NOMBRE_NEGOCIO %>",
      "description": "Distribuidora de artículos de fiesta al mayoreo en Uruapan, Michoacán. Globos, vajilla desechable, decoración temática y más.",
      "url": "<%- SITE_URL %>",
      "image": "<%- SITE_URL %>/og-image.jpg",
      "telephone": "+<%- WHATSAPP_NUMBER %>",
      "priceRange": "$$",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Uruapan",
        "addressRegion": "Michoacán",
        "addressCountry": "MX"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 19.4167,
        "longitude": -102.0667
      },
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],
          "opens": "09:00",
          "closes": "19:00"
        }
      ],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Artículos de fiesta y decoración al mayoreo"
      }
    }
    </script>

    <!-- JSON-LD: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "¿Tienen precios por mayoreo?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí, contamos con tarifas escalonadas por volumen. Entre más piezas compras, mejor precio obtienes. Aplica desde la primera pieza."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cómo puedo hacer un pedido?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Navega nuestro catálogo digital, agrega los productos al carrito y envía tu orden directamente a nuestro WhatsApp con un solo clic. Sin llamadas, sin complicaciones."
          }
        },
        {
          "@type": "Question",
          "name": "¿Hacen envíos a domicilio?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí, realizamos envíos dentro de Uruapan y zona metropolitana. También puedes recoger en cualquiera de nuestras dos sucursales."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cuántas sucursales tienen?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Contamos con dos sucursales en Uruapan: Centro (sucursal principal) y Sol Naciente (sucursal norte). Ambas con el mismo catálogo y precios."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué marcas manejan?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Somos distribuidores autorizados de Glomex, Decoratexz, Sempertex y Peyma, líderes en artículos de fiesta y decoración a nivel nacional."
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="fp-boot-overlay" aria-hidden="true">
      <div class="fp-boot-card">
        <img src="/icons/icon-512.png" alt="" class="fp-boot-logo" />
        <h1 class="fp-boot-title">Full Party</h1>
        <p class="fp-boot-subtitle">Cargando catalogo...</p>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var opened = false;
        window.__fpMarkAppReady = function () {
          if (opened) return;
          opened = true;
          document.body.classList.add('fp-app-ready');
        };

        setTimeout(function () {
          window.__fpMarkAppReady();
        }, 9000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
