    <script>
      (function () {
        var pathname = window.location.pathname || '';
        var isCatalogOrAdmin = pathname.startsWith('/catalogo') || pathname.startsWith('/admin');
        if (isCatalogOrAdmin) {
          document.documentElement.classList.add('fp-catalog-immediate');
        } else {
          document.documentElement.classList.add('fp-skip-boot');
        }
        // Preload de las primeras 4 imágenes del catálogo (LCP + above-the-fold)
        if (pathname.startsWith('/catalogo')) {
          try {
            var raw = localStorage.getItem('fp_lcp_image_v1');
            if (raw) {
              var urls = raw.charAt(0) === '[' ? JSON.parse(raw) : [raw];
              for (var i = 0; i < urls.length && i < 4; i++) {
                var u = urls[i];
                if (typeof u === 'string' && /^https?:\/\//.test(u)) {
                  var l = document.createElement('link');
                  l.rel = 'preload';
                  l.as = 'image';
                  l.href = u;
                  if (i === 0) l.fetchPriority = 'high';
                  document.head.appendChild(l);
                }
              }
            }
          } catch (e) {}
        }
      })();
    </script>

      /* ── @font-face auto-hospedadas ───────────────────────────────────────
         Los archivos están en /public/fonts/ (mismo origen).
         Los preload de arriba hacen que el browser descargue los WOFF2
         al mismo tiempo que parsea el <head>, antes de que React renderice.
         ───────────────────────────────────────────────────────── */
      @font-face {
        font-family: 'Fredoka One';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/fredoka-one.woff2') format('woff2');

        font-family: 'Nunito';

        font-weight: 400;
        font-display: swap;

      }
      @font-face {
        font-family: 'Nunito';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url('/fonts/nunito-latin-500-normal.woff2') format('woff2');
      }

        font-weight: 600;

      /* ── Critical CSS: body base ──────────────────────────────────────────
         Evita el flash blanco (FOUC) antes de que cargue el bundle CSS.
         ─────────────────────────────────────────────────────────────────── */
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        background-color: #fff8fe;
        background-image:
          radial-gradient(circle at 15% 20%, #ff3dac22 0%, transparent 35%),
          radial-gradient(circle at 85% 10%, #00d4ff22 0%, transparent 35%),
          radial-gradient(circle at 50% 80%, #ffe13522 0%, transparent 40%),
          radial-gradient(circle at 90% 70%, #a855f722 0%, transparent 30%);
        color: #1a0733;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root {
        opacity: 0;
        transition: opacity 260ms ease;
      }

      html.fp-catalog-immediate #root {
        opacity: 1;
        transition: none;
      }

      body.fp-app-ready #root {
        opacity: 1;
      }

      html.fp-skip-boot #root {
        opacity: 1;
      }

      #fp-boot-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at 20% 15%, rgba(255, 61, 172, 0.4) 0%, transparent 42%),
          radial-gradient(circle at 85% 20%, rgba(0, 212, 255, 0.35) 0%, transparent 45%),
          radial-gradient(circle at 50% 85%, rgba(255, 225, 53, 0.25) 0%, transparent 48%),
          linear-gradient(145deg, #ffffff 0%, #f9f2ff 58%, #f4edff 100%);
        opacity: 1;
        transition: opacity 360ms ease;
      }

      body.fp-app-ready #fp-boot-overlay {
        opacity: 0;
        pointer-events: none;
      }

      html.fp-skip-boot #fp-boot-overlay {
        display: none;
      }

      html.fp-catalog-immediate #fp-boot-overlay {
        display: none;
      }

      .fp-boot-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 20px 24px 18px;
        border-radius: 24px;
        border: 2px solid #e9d5ff;
        background: rgba(255, 255, 255, 0.84);
        box-shadow: 0 20px 60px rgba(107, 53, 184, 0.24);
        backdrop-filter: blur(12px);
        animation: fpBootCardIn 700ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      .fp-boot-logo {
        width: clamp(86px, 19vw, 120px);
        height: auto;
        border-radius: 24px;
        border: 2px solid #f3e8ff;
        box-shadow: 0 12px 28px rgba(107, 53, 184, 0.22);
        animation: fpBootLogoFloat 2s ease-in-out 0.6s infinite;
      }

      .fp-boot-title {
        margin: 0;
        font-family: 'Fredoka One', cursive;
        font-size: clamp(28px, 5vw, 36px);
        line-height: 1;
        background: linear-gradient(135deg, #ff3dac, #a855f7, #00d4ff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .fp-boot-subtitle {
        margin: 0;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #8b7aa8;
        font-family: 'Nunito', sans-serif;
      }

      @keyframes fpBootCardIn {
        from { opacity: 0; transform: translateY(20px) scale(0.94); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes fpBootLogoFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
    </style>

    <!-- Google Analytics 4 (carga diferida post-LCP para no bloquear el render) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      (function () {
        function loadGA() {
          if (window.__gaLoaded) return;
          window.__gaLoaded = true;
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-E07C39EMGD';
          document.head.appendChild(s);
          gtag('js', new Date());
          var displayMode = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone ? 'standalone' : 'browser';
          gtag('config', 'G-E07C39EMGD', { display_mode: displayMode });
        }
        // Cargar cuando el navegador esté idle, o al primer gesto del usuario
        if ('requestIdleCallback' in window) {
          requestIdleCallback(loadGA, { timeout: 4000 });
        } else {
          setTimeout(loadGA, 3000);
        }
        ['pointerdown', 'keydown', 'scroll'].forEach(function (ev) {
          window.addEventListener(ev, loadGA, { once: true, passive: true });
        });
      })();
    </script>

    <script>
      (function () {
        var opened = false;
        window.__fpMarkAppReady = function () {
          if (opened) return;
          opened = true;
          document.body.classList.add('fp-app-ready');
        };

        var pathname = window.location.pathname || '';
        var isCatalogOrAdmin = pathname.startsWith('/catalogo') || pathname.startsWith('/admin');
        // El logo ahora usa src directo, no data-src
        if (!isCatalogOrAdmin) {
          window.__fpMarkAppReady();
        }

        // Fallback: revelar app pronto si algo falla durante el arranque.
        setTimeout(function () {
          window.__fpMarkAppReady();
        }, 450);
      })();
    </script>
