<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbf7f3" />
    <meta name="description" content="Catálogo digital de productos. Ordena por WhatsApp y rastrea tu pedido en tiempo real. Envío local y recolección en tienda." />
    <meta name="keywords" content="catálogo, tienda, productos, pedidos, WhatsApp" />
    <meta name="author" content="<%- NOMBRE_NEGOCIO %>" />

    <!-- Open Graph -->
    <meta property="og:title" content="<%- NOMBRE_NEGOCIO %> — Catálogo Digital" />
    <meta property="og:description" content="Catálogo digital de productos. Ordena por WhatsApp y rastrea tu pedido en tiempo real." />
    <meta property="og:image" content="<%- SITE_URL %>/portada-whatsapp.jpg" />
    <meta property="og:url" content="<%- SITE_URL %>/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="<%- NOMBRE_NEGOCIO %>" />
    <meta property="og:locale" content="es_MX" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="<%- NOMBRE_NEGOCIO %> — Catálogo Digital" />
    <meta name="twitter:description" content="Catálogo digital de productos. Ordena por WhatsApp y rastrea tu pedido en tiempo real." />
    <meta name="twitter:image" content="<%- SITE_URL %>/portada-whatsapp.jpg" />

    <!-- Canonical -->
    <link rel="canonical" href="<%- SITE_URL %>/" />

    <!-- Preconnect: Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;500;600;700;800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
      <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;500;600;700;800&display=swap" />
    </noscript>
    <!-- Preconnect: placeholder images fallback -->
    <link rel="dns-prefetch" href="https://placehold.co" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="<%- NOMBRE_NEGOCIO %>" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    
    <title><%- NOMBRE_NEGOCIO %> - Catálogo Digital</title>

    <style>
      #fp-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 15%, rgba(37, 99, 235, 0.18) 0%, transparent 42%),
          radial-gradient(circle at 85% 20%, rgba(14, 165, 233, 0.12) 0%, transparent 45%),
          radial-gradient(circle at 50% 85%, rgba(99, 102, 241, 0.12) 0%, transparent 48%),
          linear-gradient(145deg, #ffffff 0%, #f1f5f9 58%, #e2e8f0 100%);
        transition: opacity 320ms ease, visibility 320ms ease;
      }

      #fp-boot-splash.fp-boot-exit {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .fp-boot-card {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 20px 24px 18px;
        border-radius: 24px;
        border: 2px solid #e2e8f0;
        background: rgba(255, 255, 255, 0.86);
        box-shadow: 0 20px 60px rgba(37, 99, 235, 0.12);
        animation: fpBootCardIn 820ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      .fp-boot-logo {
        width: clamp(86px, 20vw, 118px);
        height: auto;
        border-radius: 24px;
        border: 2px solid #e2e8f0;
        box-shadow: 0 12px 28px rgba(37, 99, 235, 0.12);
        animation: fpBootLogoIn 900ms cubic-bezier(0.16, 1, 0.3, 1), fpBootLogoFloat 2.1s ease-in-out 0.9s infinite;
      }

      .fp-boot-text {
        margin: 0;
        font-family: 'Nunito', system-ui, sans-serif;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #64748b;
      }

      .fp-boot-title {
        margin: 0;
        font-family: 'Fredoka One', cursive;
        font-size: clamp(28px, 5vw, 36px);
        line-height: 1;
        background: linear-gradient(135deg, #2563eb, #6366f1, #0ea5e9);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      @keyframes fpBootCardIn {
        from { opacity: 0; transform: translateY(28px) scale(0.93); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes fpBootLogoIn {
        from { opacity: 0; transform: rotate(-18deg) scale(0.82); }
        to { opacity: 1; transform: rotate(0deg) scale(1); }
      }

      @keyframes fpBootLogoFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
    </style>

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Store",
      "name": "<%- NOMBRE_NEGOCIO %>",
      "description": "Catálogo digital de productos. Ordena por WhatsApp y rastrea tu pedido en tiempo real.",
      "url": "<%- SITE_URL %>",
      "image": "<%- SITE_URL %>/portada-whatsapp.jpg",
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Catálogo de productos"
      }
    }
    </script>
  </head>
  <body>
    <div id="fp-boot-splash" aria-hidden="true">
      <div class="fp-boot-card">
        <img class="fp-boot-logo" src="/icons/icon-512.png" alt="<%- NOMBRE_NEGOCIO %>" />
        <h2 class="fp-boot-title"><%- NOMBRE_NEGOCIO %></h2>
        <p class="fp-boot-text">Cargando catalogo...</p>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (function initBootSplash() {
        var state = {
          appMounted: false,
          sessionReady: false,
          pageLoaded: document.readyState === 'complete',
          minVisibleUntil: Date.now() + 1200,
          hidden: false,
          timerId: null,
        };

        function maybeHideBootSplash() {
          var splash = document.getElementById('fp-boot-splash');
          if (!splash || state.hidden) return;

          if (!(state.appMounted && state.sessionReady && state.pageLoaded)) return;

          var remaining = state.minVisibleUntil - Date.now();
          if (remaining > 0) {
            if (!state.timerId) {
              state.timerId = setTimeout(function () {
                state.timerId = null;
                maybeHideBootSplash();
              }, remaining);
            }
            return;
          }

          state.hidden = true;
          splash.classList.add('fp-boot-exit');
          sessionStorage.setItem('fp_intro_v1', '1');
          setTimeout(function () {
            splash.remove();
          }, 340);
        }

        window.__fpBoot = state;
        window.__fpBootMaybeHide = maybeHideBootSplash;

        window.addEventListener('load', function () {
          state.pageLoaded = true;
          maybeHideBootSplash();
        });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
