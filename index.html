<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="Catálogo digital de globos, decoración y artículos de fiesta en Uruapan. Ordena por WhatsApp y rastrea tu pedido en tiempo real. Envío local y recolección en tienda." />
    <meta name="keywords" content="globos, artículos de fiesta, decoración, Uruapan, piñatas, letras led, Full Party" />
    <meta name="author" content="<%- NOMBRE_NEGOCIO %>" />

    <!-- Open Graph -->
    <meta property="og:title" content="<%- NOMBRE_NEGOCIO %> — Globos, Decoración y Fiestas" />
    <meta property="og:description" content="Catálogo digital de globos, decoración y artículos de fiesta en Uruapan. Ordena por WhatsApp y rastrea tu pedido en tiempo real." />
    <meta property="og:image" content="<%- SITE_URL %>/portada-whatsapp.jpg" />
    <meta property="og:url" content="<%- SITE_URL %>/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="<%- NOMBRE_NEGOCIO %>" />
    <meta property="og:locale" content="es_MX" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="<%- NOMBRE_NEGOCIO %> — Globos, Decoración y Fiestas" />
    <meta name="twitter:description" content="Catálogo digital de globos, decoración y artículos de fiesta en Uruapan. Ordena por WhatsApp y rastrea tu pedido en tiempo real." />
    <meta name="twitter:image" content="<%- SITE_URL %>/portada-whatsapp.jpg" />

    <!-- Canonical -->
    <link rel="canonical" href="<%- SITE_URL %>/" />

    <!-- Preconnect: Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;500;600;700;800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
      <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;500;600;700;800&display=swap" />
    </noscript>
    <!-- Preconnect: placeholder images fallback -->
    <link rel="dns-prefetch" href="https://placehold.co" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="<%- NOMBRE_NEGOCIO %>" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    
    <title><%- NOMBRE_NEGOCIO %> - Catálogo Digital</title>

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Store",
      "name": "<%- NOMBRE_NEGOCIO %>",
      "description": "Catálogo digital de globos, decoración y artículos de fiesta en Uruapan. Ordena por WhatsApp y rastrea tu pedido en tiempo real.",
      "url": "<%- SITE_URL %>",
      "image": "<%- SITE_URL %>/portada-whatsapp.jpg",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Uruapan",
        "addressRegion": "Michoacán",
        "addressCountry": "MX"
      },
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Artículos de fiesta y decoración"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
